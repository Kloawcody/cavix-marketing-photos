<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2A2520" />
<meta name="robots" content="noindex" />
<title>Cavix — 20 marketing photos</title>
<link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header>
    <div class="brand">CAVIX</div>
    <h1>20 marketing photos</h1>
    <p class="sub">People + locations + product UI. Tap <b>Save photo</b>, or download the full ZIP.</p>
    <div class="top-actions">
      <button type="button" class="btn" id="zipBtn">Download all (ZIP)</button>
    </div>
    <p class="status" id="status">Loading photos…</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    iPhone: Save photo → share sheet → Save Image. Or Download all (ZIP) and open in Files.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
